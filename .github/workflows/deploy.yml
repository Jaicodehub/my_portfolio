name: Deploy React App

on:
  push:
    branches:
      - develop

permissions:
  contents: write # Grants the deployment module rights to commit files

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jai_web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jai_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: jai_web/build # Directly isolates your subfolder build target
          branch: gh-pages # Creates and updates a deployment branch automatically
